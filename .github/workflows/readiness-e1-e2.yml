name: E1 E2 native readiness

on:
  push:
    branches: [readiness/e1-e2-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tasks:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux_amd64
            archive_sha256: f7a4dd825fc066449265f90642a79dff0fc0318e4c1bc0918c139f699d461964
          - runner: macos-15
            target: darwin_arm64
            archive_sha256: d6425d4c68f67e18214706c250ee4f1452f65259747b3ba85edca7741e8371d8
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.7.0'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Acquire and verify unchanged qualified runner
        shell: bash
        run: |
          set -euo pipefail
          python scripts/readiness/acquire-native.py --target '${{ matrix.target }}' --sha256 '${{ matrix.archive_sha256 }}'
          echo "NATIVE_RUNNER=$(find "$PWD/artifacts/readiness-native/runner" -type f -name playtestr)" >> "$GITHUB_ENV"
      - name: Prepare pinned targets and reviewed source defects
        run: python scripts/readiness/setup-native.py
      - name: Go checks and real interpreter oracle tests
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          for project in lazygit micro create-vite posting litecli; do
            go test -C corpus/controls/$project-oracle -count=1 ./...
            go vet -C corpus/controls/$project-oracle ./...
          done
          go test -race ./internal/runner
          go test -C corpus/controls/posting-oracle -race ./...
      - name: Native primary discovery and maintenance
        run: python scripts/readiness/run-native.py --runner "$NATIVE_RUNNER"
      - name: Real-task alternatives and sampled suite resources
        if: matrix.target == 'linux_amd64'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/competitive/bin artifacts/competitive/tools
          bash scripts/competitive/install-c1-tools.sh
          python -m pip install PyYAML==6.0.3
          python scripts/readiness/profile-native.py
          python scripts/readiness/compare-real.py --runner "$NATIVE_RUNNER" --atago "$PWD/artifacts/competitive/tools/atago"
          python scripts/readiness/measure-native.py --runner "$NATIVE_RUNNER"
          python scripts/readiness/measure-candidate.py
      - name: Prove original EOF regression and candidate on macOS
        if: matrix.target == 'darwin_arm64'
        run: READINESS_REGRESSION_ONLY=1 python scripts/readiness/measure-candidate.py
      - name: Candidate native tasks and lifecycle controls
        run: python scripts/readiness/run-native.py --runner "$PWD/artifacts/readiness-native/candidate/after-playtestr" --out artifacts/readiness-native/candidate-tasks
      - name: Candidate matched suite resources
        if: matrix.target == 'linux_amd64'
        run: python scripts/readiness/measure-native.py --runner "$PWD/artifacts/readiness-native/candidate/after-playtestr" --out artifacts/readiness-native/candidate-resources
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: readiness-native-${{ matrix.target }}-${{ github.run_attempt }}
          path: |
            artifacts/readiness-native/runner/*/playtestr*
            artifacts/readiness-native/runner/archive-sha256.txt
            artifacts/readiness-native/runner/acquisition.json
            artifacts/readiness-native/target-pins.json
            artifacts/readiness-native/setup-operations.json
            artifacts/readiness-native/tasks/**
            artifacts/readiness-native/real-comparison/**
            artifacts/readiness-native/profile/**
            artifacts/readiness-native/resources/**
            artifacts/readiness-native/candidate/**
            artifacts/readiness-native/candidate-tasks/**
            artifacts/readiness-native/candidate-resources/**
          retention-days: 14
          if-no-files-found: warn
  linux-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
          cache: false
      - name: Pin Rust and install original comparator versions
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup override set 1.85.0
          bash scripts/competitive/install-c1-tools.sh
      - name: Reproduce C1 C2 C3 direction and lifecycle controls
        run: |
          bash scripts/competitive/run-c1-campaign.sh
          bash scripts/competitive/run-c23-campaign.sh
          bash scripts/competitive/run-adversarial.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: readiness-linux-comparison-${{ github.run_attempt }}
          path: |
            artifacts/competitive/*.jsonl
            artifacts/competitive/*.json
            artifacts/competitive/versions.txt
            artifacts/competitive/logs/**
            artifacts/competitive/oracles/**
            artifacts/competitive/evidence/**
          retention-days: 14
          if-no-files-found: warn
